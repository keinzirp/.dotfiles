[which]
separator = " -> "

[filetype]
rules = [
  { url = "*/", fg = "blue" },
]

[icon]
globs = []
dirs = []
files = []
exts = []
conds = []

[notify]
icon_info = ""
icon_warn = ""
icon_error = ""

[cmp]
icon_file = ""
icon_folder = ""
icon_command = ""

# Kept intentionally close to the useful parts of nvim/init.lua.
theme = "beans" # Helix's built-in Jellybeans port.

[editor]
line-number = "relative"
cursorline = true
scrolloff = 4
mouse = true
true-color = true
rulers = [80]
bufferline = "multiple"
color-modes = true
auto-format = true
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.search]
smart-case = true

[editor.soft-wrap]
enable = true
max-indent-retain = 0
wrap-indicator = ""

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "position-percentage"]

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
C-y = [
	':sh rm -f /tmp/helix-yazi-chooser',
	':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/helix-yazi-chooser',
	':sh printf "\\x1b[?1049h\\x1b[?2004h" > /dev/tty',
	':open %sh{cat /tmp/helix-yazi-chooser}',
	':redraw',
	':set mouse false',
	':set mouse true',
]

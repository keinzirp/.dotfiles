[font]
size = 18.0
normal = {family = "LiterationMono Nerd Font", style = "Regular"}
bold = {family = "LiterationMono Nerd Font", style = "Bold"}
italic = {family = "LiterationMono Nerd Font", style = "Italic"}
bold_italic = {family = "LiterationMono Nerd Font", style = "Bold Italic"}

[window]
startup_mode = "Maximized"
option_as_alt = "OnlyLeft"
blur = false
decorations = "None"
dynamic_title = true

[scrolling]
history = 10000

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "K"
mods = "Alt|Shift"
chars = "\u001BK"

[[keyboard.bindings]]
key = "9"
mods = "Alt|Shift"
chars = "\u001B("

[[keyboard.bindings]]
key = "0"
mods = "Alt|Shift"
chars = "\u001B)"

[[keyboard.bindings]]
key = "W"
mods = "Command"
action = "None"


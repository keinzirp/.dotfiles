[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
idiomatic_version_file_enable_tools = ["node", "pnpm", "yarn", "python", "go", "java", "rust"]
minimum_release_age = "7d"
cargo.binstall_native = true
use_versions_host_track = false
activate_aggressive = true
status.missing_tools = "always"
python.uv_venv_auto = "source"
dotfiles.relative_symlinks = true

[tool_alias]
skyspell = "cargo:https://codeberg.org/your-tools/skyspell.git"
skyspell-kak = "cargo:https://codeberg.org/your-tools/skyspell.git"

[tools]
skyspell = { version = "latest", crate = "skyspell" }
skyspell-kak = { version = "latest", crate = "skyspell_kak" }
node = "26"
pnpm = "12"
go = "1.27"
python = "3.15"
java = "27"
uv = "latest"
rust = { version = "latest", components = ["rust-src"], targets = ["wasm32-wasip1"] }

"github:2e3s/aw-watcher-media-player" = { version = "latest", asset_pattern = "aw-watcher-media-player-macos-aarch64.zip" }
"github:kakoune-lsp/kakoune-lsp" = "latest"
"github:carapace-sh/carapace-bridge" = "latest"
"github:stayradiated/fred" = "latest"
"cargo:cargo-license" = "latest"
"cargo:https://github.com/anthrofract/majjit" = "latest"
# "cargo:rustlings" = "latest"
# "cargo:ttyper" = "latest"
"cargo:eza" = "latest"
"cargo:kak-tree-sitter" = "latest"
"cargo:ktsctl" = "latest"
# "cargo:sleek" = "latest"

"aqua:BurntSushi/ripgrep" = "latest"
"aqua:chmln/sd" = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
"aqua:atuinsh/atuin" = "latest"
"aqua:rust-lang/rust-analyzer" = "latest"
"aqua:tealdeer-rs/tealdeer" = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:carapace-sh/carapace-bin" = "latest"
"aqua:wagoodman/dive" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:cli/cli" = "latest"
"aqua:dandavison/delta" = "latest"
"aqua:jj-vcs/jj" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:casey/just" = "latest"
"aqua:kubernetes/kubernetes/kubectl" = "latest"
"aqua:FiloSottile/mkcert" = "latest"
"aqua:rclone/rclone" = "latest"
"aqua:linebender/resvg" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:typescript" = "7"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:svelte-language-server" = { version = "latest", trust_policy_excludes = ["svelte@4.2.20"] }
"npm:bash-language-server" = "latest"
"pipx:python-lsp-server" = "latest"
"cargo:ttyper" = "1.6.0"

[tools."http:kakoune"]
version = "2026.05.21"
url = "https://github.com/mawww/kakoune/releases/download/v{{ version }}/kakoune-{{ version }}.tar.bz2"
checksum = "sha256:be1deb3fe9808a0733ab1057309da380bb757307e8fdbb22dc478b674b6bad34"
strip_components = 0
bin_path = "bin"
postinstall = 'nu "{{ xdg_config_home }}/mise/scripts/kakoune-patched.nu"'

[dotfile_groups.aerospace]
root = "aerospace"
entries."~/.config/aerospace" = { mode = "symlink" }

[dotfile_groups.alacritty]
root = "alacritty"
entries."~/.config/alacritty" = { mode = "symlink" }

[dotfile_groups.atuin]
root = "atuin"

[dotfile_groups.git]
root = "git"
entries."~/.config/git" = { mode = "symlink" }

[dotfile_groups.jj]
root = "jj"

[dotfile_groups.kak]
root = "kak"
entries."~/.config/kak" = { mode = "symlink" }

[dotfile_groups.mise]
root = "mise"

[dotfile_groups.nushell]
root = "nushell"
exclude = ["history.txt"]

[dotfile_groups.openlogi]
root = "openlogi"

[dotfile_groups.pgcli]
root = "pgcli"
exclude = [".pgpass"]
entries."~/.config/pgcli" = { mode = "symlink" }

[dotfile_groups.pi]
root = "pi"
entries."~/.pi/agent/skills/leetcode" = { mode = "symlink" }

[dotfile_groups.timewarrior]
root = "timewarrior"
entries."~/.config/timewarrior" = { mode = "symlink" }

[dotfile_groups.yazi]
root = "yazi"
entries."~/.config/yazi" = { mode = "symlink" }

[dotfile_groups.zellij]
root = "zellij"
exclude = [".config/zellij/plugins"]

[dotfile_groups.zsh]
root = "zsh"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/nu"

[bootstrap.hooks]
post-packages = 'if [ "$(uname -s)" = Darwin ]; then /usr/bin/swift "$HOME/.config/mise/scripts/colemak-dh.swift"; fi'
post-tools = 'nu "{{ xdg_config_home }}/mise/scripts/tree-sitter.nu"'

[bootstrap.packages]
"brew:cloudflare-speed-cli" = "latest"
"brew:editorconfig" = "latest"
"brew:enchant" = "latest"
"brew:exiftool" = "latest"
"brew:ffmpeg-full" = "latest"
"brew:gnupg" = "latest"
"brew:httpie" = "latest"
"brew:imagemagick-full" = "latest"
"brew:jnsahaj/lumen/lumen" = "latest"
"brew:kakoune" = "latest"
"brew:mdcat" = "latest"
"brew:nushell" = "latest"
"brew:overmind" = "latest"
"brew:pgcli" = "latest"
"brew:pinentry-mac" = "latest"
"brew:postgresql@18" = "latest"
"brew:rm-improved" = "latest"
"brew:scc" = "latest"
"brew:timewarrior" = "latest"
"brew:watchman" = "latest"
"brew:zellij" = "latest"

"brew-cask:nikitabobko/tap/aerospace" = { version = "latest", adopt = true }
"brew-cask:activitywatch" = { version = "latest", adopt = true }
"brew-cask:pearcleaner" = { version = "latest", adopt = true }
"brew-cask:tableplus" = { version = "latest", adopt = true }
"brew-cask:alt-tab" = "latest"
"brew-cask:colemak-dh" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:font-iosevka" = "latest"
"brew-cask:font-liberation-nerd-font" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:font-terminess-ttf-nerd-font" = "latest"
"brew-cask:gimp" = "latest"
"brew-cask:hiddenbar" = "latest"
"brew-cask:keepassxc" = "latest"
"brew-cask:meld" = "latest"
"brew-cask:music-decoy" = "latest"
"brew-cask:openlogi" = "latest"
"brew-cask:orbstack" = "latest"
"brew-cask:sol" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:switch" = "latest"
"brew-cask:waterfox" = "latest"
"brew-cask:whatcable" = "latest"

[bootstrap.packages."macos-app:caffeine"]
version = "1.6.4"
url = "https://github.com/domzilla/Caffeine/releases/download/v{{version}}/Caffeine_{{version}}.zip"
sha256 = "792cf299c193b6e82d12877129844b05df8f21d4165655d4567e60291c6bd5e7"
artifact = "Caffeine.app"
adopt = true

[bootstrap.packages."macos-app:alacritty"]
version = "0.17.0"
url = "https://github.com/alacritty/alacritty/releases/download/v{{version}}/Alacritty-v{{version}}.dmg"
sha256 = "ad8d7de35fb38e43184776cac6dfee05ca325caa0b6639a06a55e54e4b026620"
artifact = "Alacritty.app"
adopt = true

[bootstrap.directories."~/Library/Logs/activitywatch-watchers"]
os = "macos"

[bootstrap.macos.launchd.agents.activitywatch]
program = "/Applications/ActivityWatch.app/Contents/MacOS/aw-qt"
run_at_load = true
keep_alive_on_failure = true
process_type = "Interactive"
stdout_path = "~/Library/Logs/activitywatch-watchers/aw-qt.out.log"
stderr_path = "~/Library/Logs/activitywatch-watchers/aw-qt.err.log"

[bootstrap.macos.launchd.agents.activitywatch-media-player]
program = "~/.local/bin/mise"
args = ["exec", "--", "aw-watcher-media-player"]
working_directory = "~"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/activitywatch-watchers/aw-watcher-media-player.out.log"
stderr_path = "~/Library/Logs/activitywatch-watchers/aw-watcher-media-player.err.log"

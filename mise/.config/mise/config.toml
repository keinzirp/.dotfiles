sha256 = "9e37f6c7ff848c7bdd3c10167614c0cb78c00e2ddcc323f1ad3ac6c008a0481f"
artifact = "qbittorrent.app"
adopt = true

[bootstrap.directories."~/Library/Logs/activitywatch-watchers"]
os = "macos"

[bootstrap.macos.launchd.agents.activitywatch]
program = "/Applications/ActivityWatch.app/Contents/MacOS/aw-qt"
run_at_load = true
keep_alive_on_failure = true
process_type = "Interactive"
stdout_path = "~/Library/Logs/activitywatch-watchers/aw-qt.out.log"
stderr_path = "~/Library/Logs/activitywatch-watchers/aw-qt.err.log"

[bootstrap.macos.launchd.agents.activitywatch-media-player]
program = "~/.local/bin/mise"
args = ["exec", "--", "aw-watcher-media-player"]
working_directory = "~"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/activitywatch-watchers/aw-watcher-media-player.out.log"
stderr_path = "~/Library/Logs/activitywatch-watchers/aw-watcher-media-player.err.log"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
idiomatic_version_file_enable_tools = ["node", "pnpm", "yarn", "python", "go", "java", "rust"]
minimum_release_age = "7d"
cargo.binstall_native = true
use_versions_host_track = false
activate_aggressive = true
status.missing_tools = "always"
python.uv_venv_auto = "source"

[tool_alias]
skyspell = "cargo:https://codeberg.org/your-tools/skyspell.git"
skyspell-kak = "cargo:https://codeberg.org/your-tools/skyspell.git"

[tools]
skyspell = { version = "latest", crate = "skyspell" }
skyspell-kak = { version = "latest", crate = "skyspell_kak" }
node = "24"
pnpm = "12"
go = "1.27"
python = "3.14"
java = "27"
uv = "latest"
rust = { version = "latest", components = ["rust-src"], targets = ["wasm32-wasip1"] }

"github:2e3s/aw-watcher-media-player" = { version = "latest", asset_pattern = "aw-watcher-media-player-macos-aarch64.zip" }
"github:kakoune-lsp/kakoune-lsp" = "latest"
"github:carapace-sh/carapace-bridge" = "latest"
"github:stayradiated/fred" = "latest"
"cargo:cargo-license" = "latest"
"cargo:https://github.com/anthrofract/majjit" = "latest"
# "cargo:rustlings" = "latest"
# "cargo:ttyper" = "latest"
"cargo:eza" = "latest"
"cargo:kak-tree-sitter" = "latest"

[bootstrap.packages."macos-app:caffeine"]
version = "1.6.4"
url = "https://github.com/domzilla/Caffeine/releases/download/v{{version}}/Caffeine_{{version}}.zip"
sha256 = "792cf299c193b6e82d12877129844b05df8f21d4165655d4567e60291c6bd5e7"
artifact = "Caffeine.app"
adopt = true

[bootstrap.packages."macos-app:alacritty"]
version = "0.17.0"
url = "https://github.com/alacritty/alacritty/releases/download/v{{version}}/Alacritty-v{{version}}.dmg"
sha256 = "ad8d7de35fb38e43184776cac6dfee05ca325caa0b6639a06a55e54e4b026620"
artifact = "Alacritty.app"
adopt = true

[bootstrap.packages."macos-app:qbittorrent"]
version = "5.2.3"

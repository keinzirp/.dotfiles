[bootstrap.macos.dock]
autohide = true
show_recents = false
apps = [
  "/Applications/Alacritty.app",
  "/Applications/Waterfox.app",
]

[bootstrap.macos.finder]
show_status_bar = true
preferred_view_style = "icon"

[bootstrap.macos.keyboard]
automatic_capitalization = true
fn_state = true

[bootstrap.macos.trackpad]
three_finger_drag = false

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 47.0

[bootstrap.macos.defaults.NSGlobalDomain]
"com.apple.swipescrolldirection" = false

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = 0
TrackpadRightClick = true
TrackpadTwoFingerDoubleTapGesture = 1
TrackpadThreeFingerHorizSwipeGesture = 2

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = 0
TrackpadRightClick = true

[bootstrap.macos.login_items]
apps = [
  "/Applications/Caffeine.app",
  "/Applications/Hidden Bar.app",
  "/Applications/Music Decoy.app",
  "/Applications/Sol.app",
  "/Applications/Stats.app",
]

[bootstrap.macos.defaults."bobko.aerospace"]
displayStyle = "monospacedText"

[bootstrap.macos.defaults."com.dwarvesv.minimalbar"]
isShowPreferences = false

[bootstrap.macos.defaults."digital.twisted.noTunes"]
hideIcon = true

[bootstrap.macos.defaults."dev.kdrag0n.MacVirt"]
terminal_theme = "default"
global_showMenubarExtra = true

[bootstrap.macos.defaults."com.alienator88.Pearcleaner"]
"settings.general.filesWarning" = true

[bootstrap.macos.defaults."com.tinyapp.TablePlus"]
ThemeKitTheme = "com.luckymarmot.ThemeKit.DarkTheme"
NSUseAnimatedFocusRing = false

[bootstrap.macos.defaults."eu.exelban.Stats"]
Battery_battery_additional = "percentageAndTime"
Battery_battery_chargerInside = true
Battery_battery_color = false
Battery_battery_xlSize = false
Battery_state = true
Bluetooth_label_position = 1
Bluetooth_stack_position = 0
Bluetooth_state = true
Bluetooth_widget = "sensors"
CPU_state = false
CPU_widget = "mini"
Clock_state = false
CombinedModules = false
Disk_state = false
GPU_state = false
Network_state = false
RAM_state = false
RAM_widget = "mini"
Sensors_state = false
keep_menubar_positions = true
